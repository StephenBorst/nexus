# Checks on pull requests only. Separate from deploy.yml on purpose: a red check here
# shows on the PR and never blocks the production deploy (deploy runs on push to main).
name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  palette:
    name: Palette drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dependency-free: fails if a PR adds a colour that isn't in app/config/theme.ts
      # (or grows a baselined legacy colour). Fix = use a theme token, or name a new
      # SIGNAL colour in theme.ts with its one job.
      - run: node tools/check-palette.mjs

  # Every *.test.mjs in the repo (money path: order sizing, signing guards, exits; trust
  # path: grading, parity, ledger inputs) + the TypeScript baseline (kept at 0 errors).
  tests:
    name: Tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          corepack enable
          n=0
          until [ "$n" -ge 3 ]; do
            yarn install --frozen-lockfile && break
            n=$((n+1))
            echo "::warning::yarn install failed (attempt $n/3) — retrying in 10s"
            sleep 10
          done
          [ "$n" -lt 3 ] || { echo "::error::yarn install failed after 3 attempts"; exit 1; }
          for d in nexus-lab-api nexus-agent-exec nexus-carry-engine; do (cd "workers/$d" && npm ci); done
      - run: node tools/run-tests.mjs
      - run: yarn tsc --noEmit
      # Lint ratchet: legacy style/a11y debt is baselined per rule (tools/lint-baseline.json);
      # a PR fails only if it ADDS errors, or brings back no-undef / rules-of-hooks (pinned at 0).
      - run: node tools/check-lint.mjs
