name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Add swap space
        run: |
          # GitHub runners now ship an active /mnt/swapfile, so `fallocate` on it fails
          # with "Text file busy". Skip if we already have enough swap; otherwise create
          # our own under a unique name. Never fail the build over swap setup.
          set +e
          CUR=$(free -m | awk '/Swap/{print $2}')
          echo "Existing swap: ${CUR}MB"
          if [ "${CUR:-0}" -ge 4000 ]; then
            echo "Swap already >= 4G — skipping."
          else
            sudo fallocate -l 4G /mnt/nexus-swapfile \
              && sudo chmod 600 /mnt/nexus-swapfile \
              && sudo mkswap /mnt/nexus-swapfile \
              && sudo swapon /mnt/nexus-swapfile
            echo "swap setup exit: $? (non-fatal)"
          fi
          free -m
          exit 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          corepack enable
          n=0
          until [ "$n" -ge 3 ]; do
            yarn install --frozen-lockfile && exit 0
            n=$((n+1))
            echo "::warning::yarn install failed (attempt $n/3) — retrying in 10s"
            sleep 10
          done
          echo "::error::yarn install failed after 3 attempts"
          exit 1

      # Nothing ships to prod unless every test passes. These are the money-path
      # (order sizing, signing guards, exits) and trust-path (grading, parity) tests.
      - name: Test
        run: |
          for d in nexus-lab-api nexus-agent-exec nexus-carry-engine; do (cd "workers/$d" && npm ci); done
          node tools/run-tests.mjs

      # Minified (Vite's default esbuild pass). `--no-minify` was added in May 2026 to dodge a runner OOM; it
      # didn't matter (minified peaks at the same ~7.3 GB, measured 2026-09-27) and it shipped phones a
      # 7.5 MB entry instead of 3.6 MB. The swap step above is what keeps the build alive.
      - name: Build
        run: yarn tsx scripts/generate-manifest.ts && yarn vite build && yarn tsx scripts/generate-manifest.ts
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

      - name: Create Pages project (if not exists)
        run: npx wrangler@3 pages project create nexus-trading-lab --production-branch=main
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy build/client --project-name=nexus-trading-lab --branch=main --commit-dirty=true

      # Cache headers, read LIVE after the deploy (cloud dev sessions can't reach the site, so
      # this log is where they're checked). Hashed /assets must be cache-forever WITHOUT
      # no-cache — Cloudflare joins header values when two _headers rules match, and browsers
      # obey the no-cache — while the HTML must revalidate. Warns, never fails: the deploy is done.
      - name: Check live cache headers
        continue-on-error: true
        run: |
          entry=$(grep -o 'src="/assets/[^"]*\.js"' build/client/index.html | head -1 | sed 's/^src="//;s/"$//')
          for i in 1 2 3 4 5 6 7 8 9; do
            curl -s -o /tmp/lab.html -D /tmp/lab.h https://trade.nexustradinglabs.com/lab || true
            grep -q "$entry" /tmp/lab.html && break
            sleep 10
          done
          html=$(grep -i '^cache-control' /tmp/lab.h | tr -d '\r')
          asset=$(curl -s -I "https://trade.nexustradinglabs.com$entry" | grep -i '^cache-control' | tr -d '\r')
          echo "HTML  /lab    → $html"
          echo "ASSET $entry → $asset"
          grep -q "$entry" /tmp/lab.html || echo "::warning::live /lab doesn't reference this build's entry yet"
          if echo "$asset" | grep -qi immutable && ! echo "$asset" | grep -qi no-cache; then echo "assets: cache-forever ✓"; else echo "::warning::hashed assets are not cache-forever: $asset"; fi
          if echo "$html" | grep -qi no-cache; then echo "html: revalidates ✓"; else echo "::warning::HTML may be cached stale: $html"; fi

      - name: Deploy Worker (nexus-lab-api)
        working-directory: workers/nexus-lab-api
        run: npm ci && npx wrangler@3 deploy

      # Agent workers deploy from committed source too, so exec/brain logic no
      # longer drifts from a forgotten manual `wrangler deploy`. Secrets set on
      # the workers persist across code deploys (wrangler deploy doesn't touch
      # them), so this only pushes code. exec has npm deps (@noble/*, bs58) →
      # npm ci; brain has none → deploy directly.
      - name: Deploy Worker (nexus-agent-exec)
        working-directory: workers/nexus-agent-exec
        run: npm ci && npx wrangler@3 deploy

      - name: Deploy Worker (nexus-agent-brain)
        working-directory: workers/nexus-agent-brain
        run: npx wrangler@3 deploy

      # Carry engine (sector-neutral funding-carry sleeve). Redeploys from source so a
      # manual `wrangler deploy` can't drift. Stays DISARMED: CARRY_LIVE is not a
      # wrangler.toml var, and `wrangler deploy` never touches secrets/vars — so this
      # only ships code; the live executor stays off until the owner arms it out-of-band.
      - name: Deploy Worker (nexus-carry-engine)
        working-directory: workers/nexus-carry-engine
        run: npm ci && npx wrangler@3 deploy
