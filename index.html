<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nexus Trading Labs</title>
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <!-- NO viewport-fit=cover: in wallet in-app webviews (Zerion) it extends the
         layout under the system UI and leaves a dead strip below the viewport that no
         CSS height can reach (verified: every viewport unit caps at 684 while screen
         is 892). OpenSea omits it and fills the frame cleanly — match that. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e0a" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="msapplication-TileColor" content="#000000" />
    <!-- Warm the two API origins every page talks to, so the first data request
         skips DNS + TLS setup (~300ms+ on mobile). -->
    <link rel="preconnect" href="https://api.orderly.org" crossorigin />
    <link rel="preconnect" href="https://og.nexustradinglabs.com" crossorigin />
    <style>
      html, body { margin: 0; background: #0a0e0a; }
      /* Boot screen: painted by the HTML itself, before any JS arrives. On a phone the
         app bundle takes seconds to download, and an empty #root showed a blank screen
         the whole time. React replaces it on first render. Pure CSS, no fonts, ~1KB. */
      .nx-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .nx-boot-mark { color: #ededf0; font-size: 12px; letter-spacing: .22em; }
      .nx-boot-sub { color: #71717a; font-size: 11px; letter-spacing: .08em; }
      .nx-boot-line { width: 140px; height: 1px; background: #232327; overflow: hidden; position: relative; }
      .nx-boot-line::after { content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 1px;
        background: #ededf0; opacity: .7; animation: nx-boot-sweep 1.4s ease-in-out infinite; }
      @keyframes nx-boot-sweep { to { left: 100%; } }
      @media (prefers-reduced-motion: reduce) { .nx-boot-line::after { animation: none; left: 30%; } }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="/favicon.webp" />
    <meta property="og:title" content="Nexus Trading Labs" />
    <meta property="og:description" content="An onchain trading terminal. Plan it. Run it. Prove it. Graded from public price. Anchored on Arbitrum." />
    <meta property="og:image" content="https://trade.nexustradinglabs.com/embed-mini.png" />
    <meta property="og:url" content="https://trade.nexustradinglabs.com" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexus Trading Labs" />
    <meta name="twitter:description" content="An onchain trading terminal. Plan it. Run it. Prove it. Graded from public price. Anchored on Arbitrum." />
    <meta name="twitter:image" content="https://trade.nexustradinglabs.com/embed-mini.png" />

    <!-- Farcaster Mini App embed — makes a cast of any Nexus link render a "Launch" button
         into /mini. Crawler reads static HTML, so this lives here (not per-route JS). -->
    <meta name="fc:miniapp" content='{"version":"1","imageUrl":"https://trade.nexustradinglabs.com/embed-mini.png","button":{"title":"⚡ Trade Perps","action":{"type":"launch_miniapp","name":"Nexus Trading Labs","url":"https://trade.nexustradinglabs.com/mini","splashImageUrl":"https://trade.nexustradinglabs.com/icon-512.png","splashBackgroundColor":"#0a0e0a"}}}' />
    <!-- Backward-compat alias for older clients that still read fc:frame/launch_frame. -->
    <meta name="fc:frame" content='{"version":"1","imageUrl":"https://trade.nexustradinglabs.com/embed-mini.png","button":{"title":"⚡ Trade Perps","action":{"type":"launch_frame","name":"Nexus Trading Labs","url":"https://trade.nexustradinglabs.com/mini","splashImageUrl":"https://trade.nexustradinglabs.com/icon-512.png","splashBackgroundColor":"#0a0e0a"}}}' />
  </head>
  <body>
    <div id="root"><div class="nx-boot" aria-label="Loading"><div class="nx-boot-mark">// NEXUS TRADING LABS</div><div class="nx-boot-line"></div><div class="nx-boot-sub">Plan it. Run it. Prove it.</div></div></div>
    <script src="/config.js"></script>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
