name = "nexus-lab-api"
main = "index.js"
compatibility_date = "2024-01-01"

# Ph20: custom domain so OG image URL is og.nexustradinglabs.com/og/trader/:wallet
# On first deploy after this change, wrangler creates the CF DNS record automatically.
# Requires nexustradinglabs.com to be a Cloudflare-managed zone (it is).
[[routes]]
pattern = "og.nexustradinglabs.com"
custom_domain = true

# Smart Money — refresh the tracked HL-trader set from the live leaderboard every
# 12h (best-effort; falls back to the static seed on failure). See scheduled().
[triggers]
# "* * * * *" = the minute grader (minuteGrader.mjs: calls fill and settle on 1-minute bars) and,
# on every 5th minute, phone alerts for agent trades. index.js returns before the hourly jobs.
crons = ["0 */12 * * *", "17 * * * *", "* * * * *"]

[[kv_namespaces]]
binding = "LAB_STORE"
id = "12c4fcbc04cc4211902d49b8abc2a751"

# Shared agent namespace — brain/exec Workers read/write here via the same binding.
[[kv_namespaces]]
binding = "NEXUS_AGENT"
id = "c3c0582ec71c4d049d0795872f39f033"

# Route hosted PRO /ai/chat through the Bankr LLM Gateway (funded by the $100k
# inference grant) instead of direct Anthropic. resolveAiUpstream falls back to
# ANTHROPIC_API_KEY if BANKR_LLM_KEY is unset. Model ids verified against
# GET /v1/models (claude-opus-4.8 / sonnet-4.6 / haiku-4.5 all present, caching
# supported). Remove this var to revert to direct Anthropic.
[vars]
# The owner's Telegram chat (the same chat nexus-ledger-anchor's ops monitor alerts): the daily digest + instant
# alerts (opsDigest.mjs). TELEGRAM_TOKEN is a secret. Not secret: a chat id can't send anything by itself.
OPS_TELEGRAM_CHAT_ID = "6927717434"
# One-wallet live lift of the graded exit (app/lib/liveLift.mjs, build #3 of docs/research/live-plan-level-reclaim.md).
# "0xWALLET@LEVEL_RECLAIM". EMPTY = DISARMED: every non-PAPER graded-exit / fixed-risk / level_reclaim config is refused.
# Kept identical in lab-api, exec and brain (liveLift.test.mjs). Arming = borst in person, in a PR that records it.
GRADED_EXIT_LIVE_LIFT = ""
# Wallets whose trading signature (personal_sign "nexus-trading-key-v1") was exposed. Every request
# presenting it is refused for trading and agent control; withdrawals to the wallet stay open
# (revokedTrading.mjs). Comma-separated addresses, never the signature itself. Remove a wallet only
# once a new signing message is live.
# 0xd9f7…b449: borst's Bankr wallet; its signature sat in the tracker app's storage (deleted 2026-10-26).
REVOKED_TRADING_WALLETS = "0xd9f7b3273b504e1473c3faba6341299d0ec9b449"
# Our engine callers (bots that publish graded calls from their own wallets). /calls/pulse counts them in
# their own "engines" block, never as people (routes-pulse.mjs, borst 2026-11-05). Engine B "Ember"
# (docs/research/engine-ab-prereg.md) and Ember M, its breakout track (eng-b-m… ids).
ENGINE_CALLER_ADDRESSES = "0x3b2cd0961aec641fb9c821661d173eedf1bcfbe4,0x493dc0ce72b8b761844cb25bc17b6aff9a28c086"
# Wallets that were an engine and now post as a person, "0xaddr@ISO": only calls the server stamped
# publishedAt on/after the date count (as a person); older (bot-made) calls count nowhere (callPulse.mjs).
# 0xd9f7…b449 = Engine A until it stopped mid-October 2026, "Apex Tape" (manual calls) from 2026-11-08 (borst).
PERSON_FROM_ADDRESSES = "0xd9f7b3273b504e1473c3faba6341299d0ec9b449@2026-11-08T00:00:00Z"
# On-chain anchoring is PAUSED for all ledgers (mirrors nexus-ledger-anchor/wrangler.toml; keep equal).
# Only the /arena/paper/root "anchoring" field reads this. The hash-chained ledgers are unaffected.
ONCHAIN_ANCHOR_LIVE = "false"
# Double-count (LIVE since 2026-09-29, borst): the hourly pass proves who made each call that appears
# in several wallets (house id or the thesis registry's on-chain event) and MARKS the other wallets'
# copies duplicateOf. Nothing is deleted; the board, feed and public views skip marked copies. The
# plan and what was marked: GET /theses/duplicates. Comment this out to go back to report-only (marks
# already written stay; they're a server field on each copy).
CALL_DEDUPE_LIVE = "true"
# The taker fee the paper record is re-read with (GET /agent/:a/paper-costs, the Lab's AFTER COSTS line), in bps
# per side. borst's account rate, 2026-10-26: Orderly Builder Gold tier, crypto taker 2.5 bps. Unset = 3, labelled
# "assumed". Display only: exec and the paper ledger don't read it.
PAPER_TAKER_FEE_BPS = "2.5"
# Oct-15 (staged, OFF): serve GET /signals/basis, the graded basis-stack read for the paid feed.
# Flip only if the re-validation holds: uncomment, commit, merge (CI deploys the worker).
# BASIS_SIGNALS_LIVE = "true"
AI_GATEWAY = "bankr"
# Spot in-app swap fee (Pass B). Non-secret config, kept HERE (not dashboard) so `wrangler
# deploy` — which resets plaintext vars to this set — can't wipe it. Both must be set for the
# fee to apply; recipient + bps are public (the recipient lands in tx calldata on-chain).
# Passed to spanDEX as integratorFeeAddress + integratorSwapFeeBps (spotQuote.mjs): Nordstern gets
# it as convenienceFee (percent) + convenienceFeeRecipient, 0x as swapFeeBps + swapFeeRecipient.
# The worker caps it at 100 bps. `feeApplied` on a live quote says whether the provider confirmed it.
# 0x joins the quote only when the ZEROX_API_KEY SECRET is set (never a var: it's a key).
# (Fabric, the old router, shut down Sept 16 2026.)
SPOT_FEE_BPS = "10"
SPOT_FEE_RECIPIENT = "0x34dFC08eB3B7eD60D00e5B2CB611ac27C152B45c"
# Flash (Definitive) integrator fee, bps, OFF while unset. The worker adds flashIntegratorFeeBps to
# BOTH /flash/quote and /flash/order (Flash requires them identical) and drops any browser-sent
# value; >100 (1%) is refused as a typo. Stacks on Definitive's own 10 bps; accrues in our
# Definitive Flash Portfolio (withdraw at app.definitive.fi). ON 2026-09-30 (borst): 10 bps, so a user
# pays 20 bps on a Flash fill (Definitive's 10 bps is a promo rate through Dec 2026) plus gas.
FLASH_FEE_BPS = "10"
# Our fee on Solana swaps (Jupiter v1, jupFee.mjs): platformFeeBps on the quote + our token account
# on the swap. Jupiter takes no cut on v1. OFF until a fee account below is set AND checks out over RPC
# (an initialized token account of the right mint). Check: GET /swap/jup/fee-status.
JUP_FEE_BPS = "10"
# Fee wallet 6uB2ugTM4m7P1BpEG6pLAc2B327nb75JUqVE6svoMRWT (borst, 2026-10-28). Its USDC account:
JUP_FEE_ACCOUNT_USDC = "Fqqax7ErDytQbsWRWoRuCodZ8oDx2NgWtzYz6AUwagKr"   # USDC buys + all sells
# LIVE since 2026-10-29 (borst, after the dry run passed). "false" = staged: only feetest=1 quotes carry the fee.
JUP_FEE_LIVE = "true"
# Its wSOL account = the wallet's associated token account for wrapped SOL (derived, same method that
# reproduces the USDC account above). Set 2026-11-14 so SOL buys carry the fee too. The worker checks it
# over RPC: until the account is CREATED on-chain (one tx from the fee wallet, ~0.002 SOL rent) the SOL-buy
# fee stays OFF and swaps are unchanged; once it exists the fee turns on within 10 min (cache), no deploy.
# Collect by transferring wSOL out; CLOSING the account to unwrap turns the SOL-buy fee off until re-created.
JUP_FEE_ACCOUNT_WSOL = "5vG1TDMyJLY3NZboX1biHtvuFgMxJ3onm6jkb87DFK38"   # SOL buys
# Our Base builder code (ERC-8021, registered at base.dev by borst 2026-09-30). Order-only; unset =
# omitted. A valid but unregistered code never fails an order (it just goes unattributed); a malformed
# one is dropped.
FLASH_ATTRIBUTION_CODE = "bc_lrqwbh7u"
# Request-bound (v2) signing enforcement (issue #14). Unset/"false" = no-op (legacy
# static walletSig only). Set to "true" to REQUIRE a fresh /auth/challenge signature
# on gated high-risk routes (withdraw first). Flip on only once clients send v2.
# AUTH_V2 = "true"
# Auth v2 trading keys + 24h trading sessions (docs/auth-v2-spec.md, build steps 2-3). ON since 2026-11-06
# (borst): ADDITIVE. The /v2/key/* and /v2/session/* routes answer, and the trading, withdraw, agent and
# TWAP routes also accept a `session`. Every v1 walletSig path is unchanged. Nothing signs with a v2 key
# until a wallet registers one. "false"/unset = every v2 route answers v2_keys_off.
AUTH_V2_KEYS = "true"
# ── Quotient Q-signals (/intel/quotient) ──────────────────────────────────────
# Q Signals is a PRO lens whose data is paid PER PULL by the USER'S wallet via x402
# (an off-chain USDC authorization on Base) — Nexus spends nothing. The client fetches
# the payment challenge (GET /intel/quotient/challenge, we probe Quotient with NO key),
# signs it, and posts the X-PAYMENT header (POST /intel/quotient) which we forward to
# Quotient — again with NO key — so the user's payment unlocks the data.
# ⚠️ So QUOTIENT_API_KEY is NO LONGER required for the live feature. It's only read by
# the LEGACY credit-metered GET /intel/quotient (kept for back-compat / an internal
# credit-funded pull). Leave it UNSET for the client-pays model, or set it if you ever
# want that credit path live:
#   npx wrangler secret put QUOTIENT_API_KEY      (value = the qt_… key)
# Optional non-secret tuning — min conviction tier 1..5 (routes default to 3):
# QUOTIENT_MIN_CONVICTION = "3"

# One-at-a-time leases for the paid paths (lock.mjs NexusLock, exported from index.js): redeeming a
# payment tx, a wallet's sim credits, the day's sim cap, and a thesis registration's Bankr submit.
# KV has no compare-and-set; without this two requests at the same instant could both redeem one tx
# or both spend one credit. SQLite-backed (works on every plan). Remove the binding = the old
# unlocked behaviour (withLock runs fn directly when NEXUS_LOCK is absent).
[[durable_objects.bindings]]
name = "NEXUS_LOCK"
class_name = "NexusLock"

[[migrations]]
tag = "v1-nexus-lock"
new_sqlite_classes = ["NexusLock"]

[observability.logs]
enabled = true
invocation_logs = true
