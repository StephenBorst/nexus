name = "nexus-agent-brain"
main = "index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "NEXUS_AGENT"
id = "c3c0582ec71c4d049d0795872f39f033"

[triggers]
crons = ["*/5 * * * *"]

[observability.logs]
enabled = true
invocation_logs = true

# CI redeploys this worker from the committed file, so the flags live HERE, not the dashboard.
[vars]
# One-wallet live lift of the graded exit (app/lib/liveLift.mjs, build #3 of docs/research/live-plan-level-reclaim.md).
# "0xWALLET@LEVEL_RECLAIM". EMPTY = DISARMED: every non-PAPER graded-exit / fixed-risk / level_reclaim config is refused.
# Kept identical in lab-api, exec and brain (liveLift.test.mjs). Arming = borst in person, in a PR that records it.
GRADED_EXIT_LIVE_LIFT = ""
# ON since 2026-11-05: the level_reclaim read for PAPER configs with signalMode = "LEVEL_RECLAIM". Turned on in
# the PR that sets up its paper wallet, after level_reclaim was served TRADEABLE (pipeline-if-then.md). Live
# configs are refused either way (app/lib/levelReclaim.mjs levelReclaimRefusal; the graded exit is paper-only too).
LEVEL_RECLAIM_LIVE = "true"

# STAGED (off): the two-sided basis read for configs with basisAnchor = "MEAN"
# (scoreboard axes basis_dev / basis_dev_x_cvd). Uncomment ONLY after it grades PREDICTIVE
# with BOTH sides represented (Oct-15 re-validation or later). Off ⇒ a MEAN config sits out.
# BASIS_TWO_SIDED_LIVE = "true"
