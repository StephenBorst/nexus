name = "nexus-agent-brain"
main = "index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "NEXUS_AGENT"
id = "c3c0582ec71c4d049d0795872f39f033"

[triggers]
crons = ["*/5 * * * *"]

[observability.logs]
enabled = true
invocation_logs = true

# STAGED (off): the two-sided basis read for configs with basisAnchor = "MEAN"
# (scoreboard axes basis_dev / basis_dev_x_cvd). Uncomment ONLY after it grades PREDICTIVE
# with BOTH sides represented (Oct-15 re-validation or later). Off ⇒ a MEAN config sits out.
# CI redeploys this worker from the committed file, so the flag lives HERE, not the dashboard.
# [vars]
# BASIS_TWO_SIDED_LIVE = "true"

# STAGED (off): the level_reclaim read for PAPER configs with signalMode = "LEVEL_RECLAIM"
# (pipeline-if-then.md, Edge: the agent rule may be built, but stays off). Uncomment ONLY in the PR
# that sets up its paper wallet, after level_reclaim is served TRADEABLE. Live configs are refused
# either way (app/lib/levelReclaim.mjs levelReclaimRefusal). Under the same [vars] table as above.
# LEVEL_RECLAIM_LIVE = "true"
